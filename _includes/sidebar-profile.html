<div class="sidebar-profile">
  <img
    src="{{ site.github.owner_gravatar_url }}"
    alt="{{ site.github.owner_name }}"
    class="profile-avatar"
  >

  <h3>
    <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>
  </h3>

  <ul class="contact-list">
    <li><a href="{{ site.github.owner_url }}">GitHub</a></li>

    {% if site.social_links.email %}
      <li><a href="{{ site.social_links.email }}">Email</a></li>
    {% endif %}

    {% if site.social_links.linkedin %}
      <li><a href="{{ site.social_links.linkedin }}">LinkedIn</a></li>
    {% endif %}
  </ul>
</div>
