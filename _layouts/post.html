---
layout: default
---

<h1>{{ page.title }}</h1>
<p>
  <em>{{ page.date | date: "%B %d, %Y" }}</em>
  {% if page.category %}
    —
    <a href="{{ '/categories/' | append: page.category | downcase | append: '/' | relative_url }}">
      {{ page.category }}
    </a>
  {% endif %}
</p>

{{ content }}
